[project]
name = "mini-llm"
version = "0.1.0"
description = "One-command setup for a headless Mac Mini AI server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setup_mini"]
