# mini-llm setup configuration
# Edit this before running: uv run python -m setup_mini

# ── System ──────────────────────────────────────────────
system:
  brew_packages:
    - cmake
    - git
    - wget
    - jq
    - htop
    - tmux
    - ffmpeg

# ── SSH ─────────────────────────────────────────────────
ssh:
  harden: true
  disable_password_auth: true

# ── Headless ────────────────────────────────────────────
# disable_sleep: prevents the Mini from sleeping so SSH and services
#   stay available. Without this, a sleeping Mini is unreachable.
headless:
  disable_sleep: true
  auto_restart_on_power_loss: false

# ── Ollama ──────────────────────────────────────────────
ollama:
  install: true
  host: "0.0.0.0"
  port: 11434
  models:
    - qwen2.5-coder:32b
    - qwen3-coder:30b
    - deepseek-r1:32b
    - phi4-mini

# ── llama.cpp ───────────────────────────────────────────
llamacpp:
  install: true
  build_from_source: true

# ── MLX ─────────────────────────────────────────────────
mlx:
  install: true
  models:
    - mlx-community/Qwen2.5-Coder-32B-Instruct-4bit

# ── Open WebUI ──────────────────────────────────────────
open_webui:
  install: true
  port: 8080

# ── Tailscale (optional) ───────────────────────────────
tailscale:
  install: false

# ── CLI ────────────────────────────────────────────────
cli:
  host: mio-mac-mini.local
  ssh_user: miotrader
  ollama_port: 11434
  llamacpp_port: 8081
  default_model: "qwen2.5-coder:32b"
